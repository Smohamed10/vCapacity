# ============================================================
# VCapacity NGINX
# Rootless React/Vite SPA serving on port 8080
# ============================================================

worker_processes auto;

pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Writable temporary paths for arbitrary OpenShift UID
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    server {
        listen 8080;
        listen [::]:8080;

        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        server_tokens off;

        # ====================================================
        # Security headers
        # ====================================================

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        add_header Permissions-Policy
            "camera=(), microphone=(), geolocation=(), payment=()"
            always;

        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
            always;

        # ====================================================
        # OpenShift health probes
        # ====================================================

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /readyz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ready"}';
        }

        # ====================================================
        # Vite-generated hashed assets
        # ====================================================

        location /assets/ {
            try_files $uri =404;

            expires 1y;

            add_header Cache-Control
                "public, max-age=31536000, immutable";

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy
                "strict-origin-when-cross-origin"
                always;
        }

        # ====================================================
        # Brand assets
        # ====================================================

        location ~* \.(?:png|svg|ico|woff2?)$ {
            try_files $uri =404;

            expires 30d;

            add_header Cache-Control
                "public, max-age=2592000";

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy
                "strict-origin-when-cross-origin"
                always;
        }

        # ====================================================
        # Never cache index.html
        # ====================================================

        location = /index.html {
            expires -1;

            add_header Cache-Control
                "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy
                "strict-origin-when-cross-origin"
                always;
        }

        # ====================================================
        # React SPA fallback
        # ====================================================

        location / {
            try_files $uri $uri/ /index.html;

            expires -1;

            add_header Cache-Control
                "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy
                "strict-origin-when-cross-origin"
                always;
        }
    }
}